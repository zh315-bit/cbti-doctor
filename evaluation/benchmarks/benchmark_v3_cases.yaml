benchmark_version: "3.0-heldout"
schema_version: "v2-compatible-1"
status: benchmark_v3_frozen
purpose: "Held-out CBT-I information-acquisition evaluation; never tuned on Agent output."
fixture_units: "Numeric diary total_sleep_time values are minutes; bedtime/wake_time are HH:MM local clock strings."
channel_rules:
  user_query_facts: "Evaluator oracle only; Agent must extract them from literal user_query."
  initial_session_facts: "Seeded in session before first turn; not inferred from hidden profile."
  follow_up_facts: "Released only after an actual ASK matching the target."
  diary_facts: "Visible only through authorized READ_DIARY; unavailable exposes no diary facts."
  evidence: "Evaluator-only expectation; external evidence enters Agent only via RETRIEVE."
case_required_fields: [case_id, difficulty, language, user_query, task_type, goal, user_query_facts, initial_session_facts, follow_up_facts, diary_facts, evidence, critical_information, secondary_information, required_resources, expected_actions, acceptable_alternative_paths, unacceptable_actions, expected_answer_scope, redundant_action_criteria, goal_drift_criteria, fabrication_criteria, critical_failure_criteria]
