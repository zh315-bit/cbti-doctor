benchmark_version: "2.0-evaluation-set"
status: benchmark_v2_frozen
purpose: >-
  Independent 40-case CBT-I evaluation set for future generalization checks. It does not
  replace Benchmark V1.1 or provide a combined score with it.
channel_rules:
  user_query_facts: "Evaluator oracle only; may enter State only through Input Understanding from literal user_query."
  initial_session_facts: "Visible only when explicitly seeded; all V2 cases begin empty."
  follow_up_facts: "Evaluator releases only the fact that answers an actual ASK; never mutate State directly."
  diary_facts: "Visible only via successful READ_DIARY; unavailable returns no facts."
  evidence: "Starts empty; external knowledge may enter only through RETRIEVE."
case_required_fields: [case_id, difficulty, language, user_query, task_type, goal, user_query_facts, initial_session_facts, follow_up_facts, diary_facts, evidence, critical_information, secondary_information, required_resources, expected_actions, acceptable_alternative_paths, unacceptable_actions, expected_answer_scope, redundant_action_criteria, goal_drift_criteria, fabrication_criteria, critical_failure_criteria]
