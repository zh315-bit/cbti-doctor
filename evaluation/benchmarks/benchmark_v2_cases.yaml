    diary_facts: {availability: unavailable, facts: {}}
    evidence: []
    critical_information: []
    secondary_information: []
    required_resources: []
    expected_actions: ["RETRIEVE(CBT-I 基本概念与适用范围)", "ANSWER(概念解释)"]
    acceptable_alternative_paths: []
    unacceptable_actions: ["ASK personal sleep details", "READ_DIARY", "diagnose the user"]
    expected_answer_scope: "解释 CBT-I 是什么及其辅助性质，不做个体化治疗承诺。"
    redundant_action_criteria: ["related evidence obtained after a duplicate RETRIEVE", "any personal intake"]
